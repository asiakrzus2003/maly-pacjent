<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#FFF6E6">
  <meta name="robots" content="noindex">
  <title>Mały pacjent, wielki odkrywca!</title>
  <script>
    // Motyw z zapisu aplikacji (ten sam klucz co SaveManager.StorageKey) – odczyt tylko lokalnie.
    try {
      var save = JSON.parse(localStorage.getItem("MalyPacjent.Save.v1") || "{}");
      if (save.darkTheme) {
        document.documentElement.className = "dark";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", "#23264A");
      }
    } catch (e) {}
  </script>
  <link rel="icon" type="image/png" href="TemplateData/bear.png">
  <link rel="apple-touch-icon" href="TemplateData/bear.png">
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; position: fixed; inset: 0;
      background: linear-gradient(#FFF6E6, #E3F1FF);
      font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }
    /* Ramka aplikacji: cały ekran telefonu; na komputerze pionowa kolumna pośrodku. */
    #app {
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; height: 100%;
      overflow: hidden;
    }
    #unity-canvas {
      display: block; width: 100%; height: 100%;
      background: #FFF6E6; outline: none; touch-action: none;
    }
    #loading {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; padding: 24px; box-sizing: border-box; text-align: center;
      background: linear-gradient(#FFF6E6, #E3F1FF);
      transition: opacity .45s ease;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading img { height: 34vh; max-height: 300px; animation: float 2.6s ease-in-out infinite; }
    #loading h1 { margin: 0; font-size: clamp(22px, 6.4vw, 34px); line-height: 1.2; color: #5EA9E6; }
    #loading h1 span { color: #F28FA8; }
    #bar { width: min(70%, 320px); height: 18px; border-radius: 9px; background: #fff; box-shadow: 0 3px 10px rgba(74,70,104,.15); overflow: hidden; }
    #fill { width: 4%; height: 100%; border-radius: 9px; background: linear-gradient(90deg, #A9D6F5, #5EA9E6); transition: width .2s ease; }
    #status { font-size: 16px; color: #8683A3; min-height: 1.3em; }
    #rotate {
      position: absolute; inset: 0; z-index: 20; display: none;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: #FFF6E6; color: #4A4668; font-size: 22px; font-weight: bold;
    }
    /* Tryb ciemny wybrany w aplikacji – ekran ładowania też jest ciemny (bez białego błysku). */
    html.dark body, html.dark #loading { background: linear-gradient(#23264A, #33295A); }
    html.dark #unity-canvas, html.dark #rotate { background: #23264A; }
    html.dark #rotate { color: #F1EEFF; }
    html.dark #loading h1 { color: #5A9BD8; }
    html.dark #loading h1 span { color: #D97F9A; }
    html.dark #bar { background: #3A3D6B; box-shadow: none; }
    html.dark #status { color: #B4B1D6; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    /* Telefon trzymany poziomo: prosimy o obrócenie. */
    @media (orientation: landscape) and (max-height: 520px) and (pointer: coarse) {
      #rotate { display: flex; }
    }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <img src="TemplateData/bear.png" alt="" onerror="this.style.display='none'">
      <h1>Mały pacjent,<br><span>wielki odkrywca!</span></h1>
      <div id="bar"><div id="fill"></div></div>
      <div id="status">Wczytywanie…</div>
    </div>
    <div id="rotate">Obróć telefon pionowo 📱</div>
  </div>

  <script>
    (function () {
      var app = document.getElementById("app");
      var canvas = document.getElementById("unity-canvas");
      var loading = document.getElementById("loading");
      var fill = document.getElementById("fill");
      var status = document.getElementById("status");

      // Aplikacja jest pionowa. Na telefonie zajmuje cały ekran; na szerokim ekranie
      // (komputer, tablet poziomo) pokazujemy ją jako pionową kolumnę 9:16.
      function layout() {
        var w = window.innerWidth, h = window.innerHeight;
        var width = (w / h > 0.8) ? Math.round(h * 9 / 16) : w;
        app.style.width = width + "px";
        app.style.height = h + "px";
      }
      window.addEventListener("resize", layout);
      window.addEventListener("orientationchange", layout);
      layout();

      // Blokada przewijania/powiększania strony gestami – dotyk ma trafiać tylko do gry.
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      var buildUrl = "Build";
      var config = {
        dataUrl: buildUrl + "/WebGL.data.unityweb",
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "MalyPacjent",
        productName: "Mały pacjent, wielki odkrywca!",
        productVersion: "1.0",
        // Ograniczenie gęstości pikseli: ostry obraz, a płynne działanie na przeciętnych telefonach.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        matchWebGLToCanvasSize: true
      };

      function fail(message) {
        status.textContent = message;
        status.style.color = "#D9607A";
      }

      var loader = document.createElement("script");
      loader.src = buildUrl + "/WebGL.loader.js";
      loader.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          fill.style.width = Math.max(4, Math.round(progress * 100)) + "%";
        }).then(function (instance) {
          window.unityInstance = instance;
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 600);
        }).catch(function (error) {
          fail("Nie udało się uruchomić aplikacji. Odśwież stronę.");
          console.error(error);
        });
      };
      loader.onerror = function () { fail("Brak połączenia. Sprawdź internet i odśwież stronę."); };
      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
